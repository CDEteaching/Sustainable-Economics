<style>
  .h5p-embed { margin: 1.5rem 0; }
  .h5p-embed iframe { border: 0; width: 100%; }
</style>
<script>
// Loads the self-hosted h5p-standalone player (h5p/player/) once per page and
// mounts every <div class="h5p-embed" data-h5p="name"> created by the h5p shortcode.
(function () {
  if (window.cdeH5pLoader) return;
  window.cdeH5pLoader = true;

  var els = document.querySelectorAll('.h5p-embed[data-h5p]');
  if (!els.length) return;

  // Browsers block fetch() on file:// pages, so the player cannot load its JSON.
  if (window.location.protocol === 'file:') {
    els.forEach(function (el) {
      el.textContent = 'Interactive exercise: open this page via a web server ' +
        '(GitHub Pages, quarto preview, or "python -m http.server --directory docs") to see it.';
    });
    return;
  }

  // Quarto writes the path from this page to the site root into this meta tag,
  // so the player is found from chapter subfolders and on GitHub Pages alike.
  var meta = document.querySelector('meta[name="quarto:offset"]');
  var base = new URL((meta ? meta.getAttribute('content') : './') + 'h5p/', window.location.href).href;

  // The player script is loaded once, on first need.
  var playerReady = null;
  function loadPlayer() {
    if (!playerReady) {
      playerReady = new Promise(function (resolve, reject) {
        var script = document.createElement('script');
        script.src = base + 'player/main.bundle.js';
        script.charset = 'UTF-8';
        script.onload = resolve;
        script.onerror = reject;
        document.body.appendChild(script);
      });
    }
    return playerReady;
  }

  function mount(el, i) {
    if (el.dataset.h5pMounted) return;
    el.dataset.h5pMounted = 'true';
    var name = el.getAttribute('data-h5p');
    loadPlayer().then(function () {
      return new H5PStandalone.H5P(el, {
        id: 'h5p-' + name + '-' + i,
        h5pJsonPath: base + 'content/' + name,
        frameJs: base + 'player/frame.bundle.js',
        frameCss: base + 'player/styles/h5p.css',
        frame: true,
        copyright: true,
        fullScreen: true,
        export: false,
        embed: false,
        icon: false
      });
    }, function () {
      el.textContent = 'H5P player not found.';
    }).catch(function (err) {
      el.textContent = 'This interactive exercise could not be loaded.';
      console.error('H5P "' + name + '":', err);
    });
  }

  // Elements inside a collapsed callout are mounted when the callout is first
  // opened: a player started while hidden measures its height as 0.
  els.forEach(function (el, i) {
    var collapse = el.closest('.callout-collapse');
    if (collapse && !collapse.classList.contains('show')) {
      collapse.addEventListener('shown.bs.collapse', function () { mount(el, i); }, { once: true });
    } else {
      mount(el, i);
    }
  });
})();
</script>
